[workspace]
resolver = "3"
members = [
    "crates/streampad-core",
    "crates/streampad-input",
    "crates/streampad-script",
    "crates/streampadd",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OMetaVR/Stream-Pad"

[workspace.dependencies]
streampad-core = { path = "crates/streampad-core" }
streampad-input = { path = "crates/streampad-input" }
streampad-script = { path = "crates/streampad-script" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
crossbeam-channel = "0.5"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
