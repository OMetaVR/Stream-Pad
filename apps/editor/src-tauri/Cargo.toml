[package]
name = "streampad"
version = "0.1.0"
description = "StreamPad editor: profiles, keys and macros for the StreamPad numpad macropad"
edition = "2024"
license = "MIT"
repository = "https://github.com/OMetaVR/Stream-Pad"
default-run = "streampad"

# Own workspace: the editor is built by the Tauri CLI, independently of the root workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
streampad-core = { path = "../../../crates/streampad-core" }
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
sha2 = "0.10"
ureq = "3"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "process"] }
zbus = "5"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
